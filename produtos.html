<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos | PRODUTIVA</title>


<!-- =================================
     FONTES
================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<link
    href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
    rel="stylesheet"
>


<link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
>


<style>

/* =================================
   RESET
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;

    transition:
        background .25s ease,
        color .25s ease;
}


/* =================================
   CORES
================================= */

:root{

    --body-bg:#000;

    --card-bg:#0A0A0A;

    --input-bg:#111;

    --border:#242424;

    --text:#fff;

    --muted:#777;

    --placeholder:#666;

    --green:#6EDC82;

    --yellow:#F5C542;

}


/* =================================
   MODO CLARO
================================= */

body.light{

    --body-bg:#F5F5F5;

    --card-bg:#FFFFFF;

    --input-bg:#F1F1F1;

    --border:transparent;

    --text:#111;

    --muted:#666;

    --placeholder:#888;

}


/* =================================
   BODY
================================= */

body{

    font-family:'Plus Jakarta Sans',sans-serif;

    background:var(--body-bg);

    color:var(--text);

    min-height:100vh;

    overflow-x:hidden;

    /* Transição simples */

    transition:
        opacity .25s ease,
        background .25s ease,
        color .25s ease;

    -webkit-tap-highlight-color:transparent;
}


/* =================================
   SAÍDA DA PÁGINA
================================= */

body.page-transition-out{

    opacity:0;
}


/* =================================
   BOTÕES / INPUTS
================================= */

button,
input,
select{

    font-family:'Plus Jakarta Sans',sans-serif;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


button:hover,
button:active,
button:focus,
button:focus-visible,
input:focus,
select:focus{

    outline:0 !important;

    box-shadow:none !important;
}


/* =================================
   MENU LATERAL
================================= */

.side-menu{

    position:fixed !important;

    top:0 !important;

    left:0 !important;

    width:240px !important;

    height:100vh !important;

    background:var(--card-bg) !important;

    border-right:1px solid var(--border);

    z-index:99999 !important;

    transform:translateX(-100%);

    transition:transform .25s ease;

    padding:24px 16px;

    overflow-y:auto !important;

    overflow-x:hidden !important;

    display:block !important;

    visibility:hidden;

    opacity:1;

    isolation:isolate;
}


.side-menu.open{

    transform:translateX(0);

    visibility:visible;

    opacity:1;
}


/* =================================
   CABEÇALHO MENU
================================= */

.side-menu-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;
}


.side-menu-logo{

    display:flex;

    align-items:center;
}


.side-menu-logo img{

    width:110px;

    height:auto;

    display:block;

    object-fit:contain;
}


.close-menu{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.close-menu:hover,
.close-menu:active,
.close-menu:focus,
.close-menu:focus-visible{

    background:transparent !important;

    color:var(--muted);

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}


.close-menu .material-icons-round{

    font-size:24px;
}


/* =================================
   SEÇÕES MENU
================================= */

.menu-section{

    margin-bottom:27px;
}


.menu-section-title{

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin:0 10px 9px;
}


/* =================================
   ITEM MENU
================================= */

.menu-item{

    width:100%;

    height:46px;

    display:flex;

    align-items:center;

    gap:12px;

    background:transparent;

    border:0;

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:700;

    text-align:left;

    padding:0 10px;

    cursor:pointer;

    outline:0;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.menu-item .material-icons-round{

    color:var(--muted);

    font-size:21px;
}


.menu-item.active{

    background:var(--input-bg);
}


.menu-item.active .material-icons-round{

    color:var(--text);
}


.menu-item:hover{

    background:var(--input-bg);

    color:var(--text);
}


.menu-item:active,
.menu-item:focus,
.menu-item:focus-visible{

    background:var(--input-bg);

    color:var(--text);

    outline:0 !important;

    box-shadow:none !important;
}


/* =================================
   OVERLAY
================================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:99998;

    opacity:0;

    visibility:hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


.menu-overlay.open{

    opacity:1;

    visibility:visible;
}


/* =================================
   HAMBÚRGUER
================================= */

.menu-btn{

    position:fixed;

    top:20px;

    left:16px;

    width:50px;

    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    z-index:1100;

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    filter:none !important;

    text-shadow:none !important;

    appearance:none;

    -webkit-appearance:none;

    -webkit-tap-highlight-color:transparent;
}


.menu-btn:hover,
.menu-btn:active,
.menu-btn:focus,
.menu-btn:focus-visible{

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    outline:0 !important;

    box-shadow:none !important;
}


.menu-btn .material-icons-round{

    font-size:28px;

    color:var(--muted);
}


body.menu-open .menu-btn{

    display:none !important;
}


/* =================================
   CONTEÚDO PRINCIPAL
================================= */

.main{

    min-height:100vh;

    padding:
        80px
        16px
        20px;
}


/* =================================
   HEADER
================================= */

.header{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:20px;

    margin-bottom:35px;
}


.header-left h1{

    font-size:30px;

    line-height:1.2;

    font-weight:800;

    letter-spacing:-1px;

    margin-bottom:8px;
}


.header-left p{

    font-size:14px;

    color:var(--muted);
}


/* =================================
   AÇÕES SUPERIORES
================================= */

.top-actions{

    display:flex;

    align-items:center;

    gap:9px;
}


.icon-button{

    width:44px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    border-radius:11px;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.icon-button:hover,
.icon-button:active,
.icon-button:focus,
.icon-button:focus-visible{

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    outline:0 !important;

    box-shadow:none !important;
}


.icon-button .material-icons-round{

    font-size:24px;
}


/* =================================
   TOOLBAR
================================= */

.toolbar{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:28px;
}


/* =================================
   PESQUISA
================================= */

.search-box{

    position:relative;

    flex:1;
}


.search-box .material-icons-round{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    font-size:21px;

    color:var(--muted);

    pointer-events:none;
}


.search-box input{

    width:100%;

    height:52px;

    padding:0 18px 0 48px;

    background:var(--input-bg);

    color:var(--text);

    border:1px solid var(--border);

    border-radius:12px;

    font-size:14px;
}


.search-box input::placeholder{

    color:var(--placeholder);
}


/* =================================
   CATEGORIA
================================= */

.category-select{

    width:190px;

    height:52px;

    padding:0 16px;

    background:var(--input-bg);

    color:var(--text);

    border:1px solid var(--border);

    border-radius:12px;

    font-size:14px;

    cursor:pointer;
}


/* =================================
   ADICIONAR PRODUTO
================================= */

.add-product{

    height:52px;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    background:var(--yellow);

    color:#000;

    border:0;

    border-radius:12px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    white-space:nowrap;
}


.add-product .material-icons-round{

    font-size:20px;
}


/* =================================
   CABEÇALHO PRODUTOS
================================= */

.products-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:18px;
}


.products-header h2{

    font-size:18px;

    font-weight:700;
}


.products-count{

    font-size:13px;

    color:var(--muted);
}


/* =================================
   GRID
================================= */

.products-grid{

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:16px;
}


/* =================================
   EMPTY STATE
================================= */

.empty-state{

    grid-column:1/-1;

    min-height:320px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:var(--card-bg);

    border:1px solid var(--border);

    border-radius:16px;

    text-align:center;

    padding:40px 20px;
}


.empty-icon{

    width:64px;

    height:64px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:18px;

    border-radius:16px;

    background:var(--input-bg);

    color:var(--muted);
}


.empty-icon .material-icons-round{

    font-size:30px;
}


.empty-state h3{

    font-size:17px;

    font-weight:700;

    margin-bottom:8px;
}


.empty-state p{

    max-width:350px;

    font-size:13px;

    line-height:1.6;

    color:var(--muted);
}


/* =================================
   MODO CLARO
================================= */

body.light .empty-state{

    border-color:transparent;
}


body.light .search-box input,
body.light .category-select{

    border-color:transparent;
}


/* =================================
   TABLET / MOBILE
================================= */

@media(max-width:767px){

    .side-menu{

        transform:translateX(-100%) !important;

        visibility:hidden;

        transition:transform .25s ease;
    }


    .side-menu.open{

        transform:translateX(0) !important;

        visibility:visible !important;
    }


    .menu-btn{

        display:flex;
    }


    .main{

        margin-left:0;

        padding:
            90px
            16px
            25px;
    }


    .header{

        margin-bottom:28px;
    }


    .header-left h1{

        font-size:25px;
    }


    .header-left p{

        font-size:13px;
    }


    .toolbar{

        flex-wrap:wrap;

        gap:10px;
    }


    .search-box{

        flex:1 1 100%;
    }


    .category-select{

        width:100%;

        flex:1 1 100%;
    }


    .add-product{

        width:100%;

        flex:1 1 100%;
    }


    .products-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }

}


/* =================================
   TELAS MUITO PEQUENAS
================================= */

@media(max-width:420px){

    .products-grid{

        grid-template-columns:1fr;
    }

}


/* =================================
   DESKTOP
================================= */

@media(min-width:768px){

    body{

        padding-left:280px;

        padding-right:40px;
    }


    .side-menu{

        transform:translateX(0) !important;

        visibility:visible !important;

        opacity:1 !important;
    }


    .menu-overlay{

        display:none !important;

        visibility:hidden !important;

        opacity:0 !important;
    }


    .menu-btn{

        display:none !important;
    }


    .close-menu{

        display:none !important;
    }


    .main{

        margin-left:0;

        padding:
            80px
            0
            20px;
    }


    .products-grid{

        grid-template-columns:
            repeat(5,minmax(0,1fr));
    }

}


/* =================================
   DESKTOP GRANDE
================================= */

@media(min-width:1400px){

    .main{

        padding-right:0;
    }

}


/* =================================
   PROTEÇÃO
================================= */

.products-grid{

    min-width:0;
}

</style>

</head>


<body>


<!-- =================================
     OVERLAY
================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu()">
</div>


<!-- =================================
     MENU LATERAL
================================= -->

<aside
    class="side-menu"
    id="sideMenu">


    <div class="side-menu-header">


        <div class="side-menu-logo">

            <img
                src="./assets/logo.png"
                alt="PRODUTIVA">

        </div>


        <button
            class="close-menu"
            onclick="closeMenu()"
            aria-label="Fechar menu">

            <span class="material-icons-round">
                close
            </span>

        </button>

    </div>


    <!-- PRINCIPAL -->

    <div class="menu-section">


        <div class="menu-section-title">
            Principal
        </div>


        <button
            class="menu-item"
            onclick="menuAction('Dashboard')">

            <span class="material-icons-round">
                dashboard
            </span>

            <span>
                Dashboard
            </span>

        </button>

    </div>


    <!-- GESTÃO -->

    <div class="menu-section">


        <div class="menu-section-title">
            Gestão
        </div>


        <button
            class="menu-item active"
            onclick="menuAction('Produtos')">

            <span class="material-icons-round">
                inventory_2
            </span>

            <span>
                Produtos
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Marketplace')">

            <span class="material-icons-round">
                storefront
            </span>

            <span>
                Marketplace
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Afiliados')">

            <span class="material-icons-round">
                groups
            </span>

            <span>
                Afiliados
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Financeiro')">

            <span class="material-icons-round">
                account_balance_wallet
            </span>

            <span>
                Financeiro
            </span>

        </button>

    </div>


    <!-- CONTA -->

    <div class="menu-section">


        <div class="menu-section-title">
            Conta
        </div>


        <button
            class="menu-item"
            onclick="menuAction('Perfil')">

            <span class="material-icons-round">
                person_outline
            </span>

            <span>
                Perfil
            </span>

        </button>

    </div>


</aside>


<!-- =================================
     HAMBÚRGUER
================================= -->

<button
    class="menu-btn"
    onclick="openMenu()"
    aria-label="Abrir menu">

    <span class="material-icons-round">
        menu
    </span>

</button>


<!-- =================================
     CONTEÚDO
================================= -->

<main class="main">


    <!-- HEADER -->

    <header class="header">


        <div class="header-left">


            <h1>
                Produtos
            </h1>


            <p>
                Gerencie todos os produtos da sua loja.
            </p>


        </div>


        <div class="top-actions">


            <button
                class="icon-button"
                onclick="toggleNotifications()"
                aria-label="Notificações">

                <span class="material-icons-round">
                    notifications_none
                </span>

            </button>


        </div>


    </header>


    <!-- TOOLBAR -->

    <div class="toolbar">


        <div class="search-box">


            <span class="material-icons-round">
                search
            </span>


            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar produtos..."
                oninput="filterProducts"
            >


        </div>


        <select
            class="category-select"
            id="categorySelect"
            onchange="filterProducts()">


            <option value="all">
                Todas as categorias
            </option>


            <option value="Eletrónicos">
                Eletrónicos
            </option>


            <option value="Roupas">
                Roupas
            </option>


            <option value="Beleza">
                Beleza
            </option>


            <option value="Casa">
                Casa
            </option>


            <option value="Acessórios">
                Acessórios
            </option>


        </select>


        <button
            class="add-product"
            onclick="goToRegister()">


            <span class="material-icons-round">
                add
            </span>


            <span>
                Cadastrar produto
            </span>


        </button>


    </div>


    <!-- CABEÇALHO PRODUTOS -->

    <div class="products-header">


        <h2>
            Meus produtos
        </h2>


        <span
            class="products-count"
            id="productsCount">

            0 produtos

        </span>

    </div>


    <!-- PRODUTOS -->

    <section
        class="products-grid"
        id="productsGrid">
    </section>


</main>


<!-- =================================
     TEMA GLOBAL
================================= -->

<script src="./js/theme.js"></script>


<script>

/* =================================
   MENU
================================= */

function openMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const menuOverlay =
        document.getElementById("menuOverlay");


    sideMenu.classList.add("open");

    menuOverlay.classList.add("open");

    document.body.classList.add("menu-open");

    document.body.style.overflow =
        "hidden";
}


function closeMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const menuOverlay =
        document.getElementById("menuOverlay");


    sideMenu.classList.remove("open");

    menuOverlay.classList.remove("open");

    document.body.classList.remove("menu-open");

    document.body.style.overflow =
        "";
}


/* =================================
   NAVEGAÇÃO GLOBAL
================================= */

function menuAction(item){

    closeMenu();


    const routes = {

        Dashboard:
            "./dashboard.html",

        Produtos:
            "./produtos.html",

        Marketplace:
            "./marketplace.html",

        Afiliados:
            "./afiliados.html",

        Financeiro:
            "./financeiro.html",

        Perfil:
            "./perfil.html"

    };


    if(routes[item]){

        navigateTo(
            routes[item]
        );

    }

}


/* =================================
   CADASTRAR PRODUTO
================================= */

function goToRegister(){

    navigateTo(
        "./cadastrar-produto.html"
    );

}


/* =================================
   PRODUTOS
================================= */

const products = [];


function filterProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    const count =
        document.getElementById(
            "productsCount"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const categorySelect =
        document.getElementById(
            "categorySelect"
        );


    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const category =
        categorySelect.value;


    const filtered =
        products.filter(product => {


            const matchesSearch =
                product.name
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =
                category === "all" ||
                product.category === category;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    count.textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "produto"
                : "produtos"
        }`;


    if(filtered.length === 0){

        grid.innerHTML = `

            <div class="empty-state">


                <div class="empty-icon">


                    <span class="material-icons-round">
                        inventory_2
                    </span>


                </div>


                <h3>
                    Nenhum produto encontrado
                </h3>


                <p>
                    Você ainda não possui produtos cadastrados.
                </p>


            </div>

        `;

        return;
    }


    grid.innerHTML =
        filtered.map(product => `

            <article class="product-card">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ${product.price} MT
                </p>

            </article>

        `).join("");

}


/* =================================
   NOTIFICAÇÕES
================================= */

function toggleNotifications(){

    alert(
        "Você não possui novas notificações."
    );

}


/* =================================
   ESC
================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeMenu();

        }

    }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
    "resize",
    function(){

        if(window.innerWidth >= 768){

            closeMenu();

        }

    }
);


/* =================================
   INICIALIZAÇÃO
================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        filterProducts();

    }
);

</script>


</body>

</html>
