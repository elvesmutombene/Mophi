<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos | PRODUTIVA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
rel="stylesheet">


<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

:root{

    --body-bg:#000;
    --card-bg:#0A0A0A;
    --input-bg:#111;
    --border:#242424;
    --text:#fff;
    --muted:#777;
    --placeholder:#666;
    --green:#6EDC82;
    --yellow:#F5C542;

}


/* ================================
   MODO CLARO
================================ */

body.light{

    --body-bg:#F5F5F5;
    --card-bg:#fff;
    --input-bg:#F1F1F1;
    --border:transparent;
    --text:#111;
    --muted:#666;
    --placeholder:#888;

}


/* ================================
   BODY
================================ */

body{

    background:var(--body-bg);

    font-family:'Plus Jakarta Sans',sans-serif;

    color:var(--text);

    padding:80px 16px 30px;

    min-height:100vh;

    -webkit-tap-highlight-color:transparent;

}


/* ================================
   MENU
================================ */

.side-menu{

    position:fixed;

    top:0;
    left:0;

    width:240px;
    height:100vh;

    background:var(--card-bg);

    border-right:1px solid var(--border);

    z-index:99999;

    transform:translateX(-100%);

    transition:transform .25s ease;

    padding:24px 16px;

    overflow-y:auto;

    visibility:hidden;

}


.side-menu.open{

    transform:translateX(0);

    visibility:visible;

}


/* ================================
   MENU HEADER
================================ */

.side-menu-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;

}


.side-menu-logo img{

    width:110px;

    height:auto;

    display:block;

}


.close-menu{

    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

}


/* ================================
   MENU ITEMS
================================ */

.menu-section{

    margin-bottom:27px;

}


.menu-section-title{

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin:0 10px 9px;

}


.menu-item{

    width:100%;
    height:46px;

    display:flex;
    align-items:center;

    gap:12px;

    background:transparent;

    border:0;

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:700;

    text-align:left;

    padding:0 10px;

    cursor:pointer;

}


.menu-item .material-icons-round{

    color:var(--muted);

    font-size:21px;

}


.menu-item.active{

    background:var(--input-bg);

}


.menu-item.active .material-icons-round{

    color:var(--text);

}


/* ================================
   OVERLAY
================================ */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:99998;

    opacity:0;

    visibility:hidden;

    transition:.25s;

}


.menu-overlay.open{

    opacity:1;

    visibility:visible;

}


/* ================================
   HAMBURGUER
================================ */

.menu-btn{

    position:absolute;

    top:20px;
    left:16px;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

}


.menu-btn .material-icons-round{

    font-size:28px;

}


/* ================================
   TOP ACTIONS
================================ */

.top-actions{

    position:absolute;

    top:20px;
    right:16px;

    display:flex;

    gap:9px;

}


.notification-btn,
.theme-btn{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

}


.notification-btn .material-icons-round,
.theme-btn .material-symbols-outlined{

    font-size:24px;

}


/* ================================
   CONTAINER
================================ */

.products-container{

    width:100%;

    max-width:1100px;

    margin:0 auto;

}


/* ================================
   CABEÇALHO
================================ */

.page-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}


.page-title{

    font-size:23px;

    font-weight:800;

}


.page-subtitle{

    margin-top:5px;

    color:var(--muted);

    font-size:12px;

}


/* ================================
   BOTÃO CADASTRAR
================================ */

.register-btn{

    height:44px;

    padding:0 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    background:var(--text);

    color:var(--body-bg);

    border:0;

    border-radius:9px;

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

}


.register-btn .material-icons-round{

    font-size:19px;

}


/* ================================
   FILTROS
================================ */

.filters{

    display:grid;

    grid-template-columns:1fr 180px;

    gap:12px;

    margin-bottom:20px;

}


.search-box,
.category-box{

    height:48px;

    background:var(--card-bg);

    border:1px solid var(--border);

    border-radius:10px;

    display:flex;

    align-items:center;

}


.search-box{

    padding:0 14px;

    gap:10px;

}


.search-box .material-icons-round{

    color:var(--muted);

    font-size:21px;

}


.search-box input{

    width:100%;

    height:100%;

    background:transparent;

    border:0;

    outline:0;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

}


.search-box input::placeholder{

    color:var(--placeholder);

}


.category-box{

    padding:0 12px;

}


.category-box select{

    width:100%;

    height:100%;

    background:transparent;

    border:0;

    outline:0;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

}


/* ================================
   PRODUTOS
================================ */

.products-card{

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:22px;

}


.products-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.products-title{

    font-size:15px;

    font-weight:800;

}


.products-count{

    color:var(--muted);

    font-size:11px;

}


/* ================================
   GRID
================================ */

.products-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:15px;

}


/* ================================
   PRODUTO
================================ */

.product-item{

    border:1px solid var(--border);

    border-radius:10px;

    overflow:hidden;

    background:var(--input-bg);

}


.product-image{

    width:100%;

    height:170px;

    background:#151515;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.product-image img{

    width:100%;
    height:100%;

    object-fit:cover;

}


.product-image .material-icons-round{

    color:var(--muted);

    font-size:35px;

}


.product-info{

    padding:14px;

}


.product-name{

    font-size:13px;

    font-weight:800;

    margin-bottom:7px;

}


.product-category{

    font-size:10px;

    color:var(--muted);

    margin-bottom:10px;

}


.product-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.product-price{

    font-size:13px;

    font-weight:800;

    color:var(--green);

}


.stock{

    color:var(--muted);

    font-size:10px;

}


/* ================================
   ESTADO VAZIO
================================ */

.empty-products{

    min-height:260px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}


.empty-products .material-icons-round{

    font-size:40px;

    color:var(--muted);

    margin-bottom:12px;

}


.empty-title{

    font-size:14px;

    font-weight:800;

}


.empty-text{

    margin-top:6px;

    color:var(--muted);

    font-size:11px;

}


/* ================================
   DESKTOP
================================ */

@media(min-width:768px){

    body{

        padding-left:280px;

        padding-right:40px;

    }


    .side-menu{

        transform:translateX(0);

        visibility:visible;

    }


    .menu-btn{

        display:none;

    }


    .close-menu{

        display:none;

    }


    .menu-overlay{

        display:none;

    }

}


/* ================================
   TABLET
================================ */

@media(max-width:767px){

    .products-container{

        max-width:600px;

    }


    .page-title{

        font-size:20px;

    }


    .products-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

    }

}


/* ================================
   CELULAR
================================ */

@media(max-width:520px){

    body{

        padding:80px 14px 25px;

    }


    .top-actions{

        right:14px;

    }


    .page-header{

        align-items:flex-start;

    }


    .register-btn{

        width:44px;

        padding:0;

    }


    .register-btn span:last-child{

        display:none;

    }


    .filters{

        grid-template-columns:1fr;

    }


    .products-card{

        padding:17px;

    }


    .products-grid{

        grid-template-columns:1fr;

    }


    .product-image{

        height:190px;

    }

}

</style>

</head>


<body>


<!-- OVERLAY -->

<div
class="menu-overlay"
id="menuOverlay"
onclick="closeMenu()">
</div>


<!-- MENU -->

<aside
class="side-menu"
id="sideMenu">


<div class="side-menu-header">

<div class="side-menu-logo">

<img
src="./assets/logo.png"
alt="PRODUTIVA">

</div>


<button
class="close-menu"
onclick="closeMenu()">

<span class="material-icons-round">
close
</span>

</button>

</div>


<div class="menu-section">

<div class="menu-section-title">
Principal
</div>


<button
class="menu-item"
onclick="menuAction('Dashboard')">

<span class="material-icons-round">
dashboard
</span>

<span>
Dashboard
</span>

</button>

</div>


<div class="menu-section">

<div class="menu-section-title">
Gestão
</div>


<button
class="menu-item active">

<span class="material-icons-round">
inventory_2
</span>

<span>
Produtos
</span>

</button>


<button
class="menu-item"
onclick="menuAction('Marketplace')">

<span class="material-icons-round">
storefront
</span>

<span>
Marketplace
</span>

</button>


<button
class="menu-item"
onclick="menuAction('Afiliados')">

<span class="material-icons-round">
groups
</span>

<span>
Afiliados
</span>

</button>


<button
class="menu-item"
onclick="menuAction('Financeiro')">

<span class="material-icons-round">
account_balance_wallet
</span>

<span>
Financeiro
</span>

</button>

</div>


<div class="menu-section">

<div class="menu-section-title">
Conta
</div>


<button
class="menu-item"
onclick="menuAction('Perfil')">

<span class="material-icons-round">
person_outline
</span>

<span>
Perfil
</span>

</button>

</div>

</aside>


<!-- HAMBURGUER -->

<button
class="menu-btn"
onclick="openMenu()">

<span class="material-icons-round">
menu
</span>

</button>


<!-- AÇÕES -->

<div class="top-actions">


<button
class="notification-btn"
onclick="openNotifications()">

<span class="material-icons-round">
notifications_none
</span>

</button>


<button
class="theme-btn"
onclick="toggleTheme()">

<span
class="material-symbols-outlined"
id="themeIcon">

wb_sunny

</span>

</button>

</div>


<!-- CONTEÚDO -->

<main class="products-container">


<div class="page-header">

<div>

<div class="page-title">
Produtos
</div>

<div class="page-subtitle">
Gerencie os produtos da sua conta
</div>

</div>


<button
class="register-btn"
onclick="registerProduct()">

<span class="material-icons-round">
add
</span>

<span>
Cadastrar produto
</span>

</button>

</div>


<!-- FILTROS -->

<div class="filters">


<div class="search-box">

<span class="material-icons-round">
search
</span>

<input
type="search"
id="searchInput"
placeholder="Pesquisar produto...">

</div>


<div class="category-box">

<select id="categoryFilter">

<option value="">
Todas as categorias
</option>

<option value="Eletrônicos">
Eletrônicos
</option>

<option value="Moda">
Moda
</option>

<option value="Beleza">
Beleza
</option>

<option value="Casa">
Casa
</option>

<option value="Outros">
Outros
</option>

</select>

</div>

</div>


<!-- PRODUTOS -->

<section class="products-card">


<div class="products-header">

<div class="products-title">
Produtos cadastrados
</div>


<div
class="products-count"
id="productsCount">

0 produtos

</div>

</div>


<div
class="products-grid"
id="productsGrid">


<!-- PRODUTOS APARECEM AQUI -->


<div class="empty-products"
id="emptyProducts">

<span class="material-icons-round">
inventory_2
</span>


<div class="empty-title">
Nenhum produto cadastrado
</div>


<div class="empty-text">
Cadastre seu primeiro produto para começar.
</div>

</div>


</div>


</section>


</main>


<script src="./js/theme.js"></script>


<script>

/* ================================
   MENU
================================ */

function openMenu(){

    document
    .getElementById("sideMenu")
    .classList.add("open");

    document
    .getElementById("menuOverlay")
    .classList.add("open");

    document.body.style.overflow="hidden";

}


function closeMenu(){

    document
    .getElementById("sideMenu")
    .classList.remove("open");

    document
    .getElementById("menuOverlay")
    .classList.remove("open");

    document.body.style.overflow="";

}


/* ================================
   NAVEGAÇÃO
================================ */

function menuAction(item){

    const routes={

        Dashboard:"./dashboard.html",

        Produtos:"./produtos.html",

        Marketplace:"./marketplace.html",

        Afiliados:"./afiliados.html",

        Financeiro:"./financeiro.html",

        Perfil:"./perfil.html"

    };


    if(routes[item]){

        window.location.href=routes[item];

    }

}


/* ================================
   CADASTRAR
================================ */

function registerProduct(){

    alert("Área de cadastro de produto");

}


/* ================================
   NOTIFICAÇÕES
================================ */

function openNotifications(){

    alert("Notificações");

}


/* ================================
   PESQUISA
================================ */

const searchInput=
document.getElementById("searchInput");

const categoryFilter=
document.getElementById("categoryFilter");


searchInput.addEventListener(
"input",
filterProducts
);


categoryFilter.addEventListener(
"change",
filterProducts
);


function filterProducts(){

    /*
       Aqui vamos ligar ao Supabase.

       Quando os produtos estiverem
       vindo do banco, esta função
       filtrará:

       - Nome
       - Categoria
    */

}


/* ================================
   TEMA
================================ */

function updateThemeIcon(){

    const icon=
    document.getElementById("themeIcon");

    if(!icon)return;


    const light=
    document.body.classList.contains("light");


    icon.textContent=
    light
    ? "dark_mode"
    : "wb_sunny";

}


document.addEventListener(
"DOMContentLoaded",
updateThemeIcon
);


const observer=
new MutationObserver(
updateThemeIcon
);


observer.observe(
document.body,
{
    attributes:true,
    attributeFilter:["class"]
});


</script>


</body>

</html>
