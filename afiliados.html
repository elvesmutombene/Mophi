<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afiliados | PRODUTIVA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
rel="stylesheet">


<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

:root{

    --body-bg:#000;
    --card-bg:#0A0A0A;
    --input-bg:#111;
    --border:#242424;

    --text:#fff;
    --muted:#777;
    --placeholder:#666;

    --green:#6EDC82;
    --yellow:#F5C542;
    --red:#ff5555;

}


/* ================================
   MODO CLARO
================================ */

body.light{

    --body-bg:#F5F5F5;
    --card-bg:#fff;
    --input-bg:#F1F1F1;

    --border:transparent;

    --text:#111;
    --muted:#666;
    --placeholder:#888;

}


/* ================================
   BODY
================================ */

body{

    background:var(--body-bg);

    font-family:'Plus Jakarta Sans',sans-serif;

    color:var(--text);

    padding:80px 16px 30px;

    min-height:100vh;

    -webkit-tap-highlight-color:transparent;

}


/* ================================
   MENU
================================ */

.side-menu{

    position:fixed;

    top:0;
    left:0;

    width:240px;
    height:100vh;

    background:var(--card-bg);

    border-right:1px solid var(--border);

    z-index:99999;

    transform:translateX(-100%);

    transition:transform .25s ease;

    padding:24px 16px;

    overflow-y:auto;

    visibility:hidden;

}


.side-menu.open{

    transform:translateX(0);

    visibility:visible;

}


/* ================================
   MENU HEADER
================================ */

.side-menu-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;

}


.side-menu-logo img{

    width:110px;

    height:auto;

    display:block;

}


.close-menu{

    width:40px;
    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

    cursor:pointer;

}


/* ================================
   MENU SECTIONS
================================ */

.menu-section{

    margin-bottom:27px;

}


.menu-section-title{

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin:0 10px 9px;

}


.menu-item{

    width:100%;
    height:46px;

    display:flex;

    align-items:center;

    gap:12px;

    background:transparent;

    border:0;

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:700;

    text-align:left;

    padding:0 10px;

    cursor:pointer;

}


.menu-item .material-icons-round{

    color:var(--muted);

    font-size:21px;

}


.menu-item.active{

    background:var(--input-bg);

}


.menu-item.active .material-icons-round{

    color:var(--text);

}


/* ================================
   OVERLAY
================================ */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:99998;

    opacity:0;

    visibility:hidden;

    transition:.25s;

}


.menu-overlay.open{

    opacity:1;

    visibility:visible;

}


/* ================================
   HAMBURGUER
================================ */

.menu-btn{

    position:absolute;

    top:20px;
    left:16px;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

    cursor:pointer;

}


.menu-btn .material-icons-round{

    font-size:28px;

}


/* ================================
   TOPO
================================ */

.top-actions{

    position:absolute;

    top:20px;
    right:16px;

    display:flex;

    gap:9px;

}


.notification-btn,
.theme-btn{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

    cursor:pointer;

}


.notification-btn .material-icons-round,
.theme-btn .material-symbols-outlined{

    font-size:24px;

}


/* ================================
   CONTAINER
================================ */

.container{

    width:100%;

    max-width:1100px;

    margin:0 auto;

}


/* ================================
   CABEÇALHO
================================ */

.page-header{

    margin-bottom:25px;

}


.page-title{

    font-size:23px;

    font-weight:800;

}


.page-subtitle{

    margin-top:5px;

    color:var(--muted);

    font-size:12px;

}


/* ================================
   CARDS
================================ */

.stats-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:16px;

    margin-bottom:20px;

}


.stat-card{

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:23px;

    min-height:135px;

}


.stat-icon{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--muted);

    margin-bottom:15px;

}


.stat-icon .material-icons-round{

    font-size:28px;

}


.stat-label{

    color:var(--muted);

    font-size:11px;

    font-weight:700;

}


.stat-value{

    margin-top:6px;

    font-size:25px;

    font-weight:900;

}


/* ================================
   PESQUISA
================================ */

.search-card{

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:16px;

    margin-bottom:16px;

}


.search-box{

    position:relative;

}


.search-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:21px;

}


.search-input{

    width:100%;

    height:48px;

    background:var(--input-bg);

    border:1px solid var(--border);

    border-radius:9px;

    outline:none;

    padding:0 15px 0 45px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

}


.search-input::placeholder{

    color:var(--placeholder);

}


.search-input:focus{

    border-color:var(--muted);

}


/* ================================
   PRODUTOS
================================ */

.products-card{

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:22px;

}


.products-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}


.products-title{

    font-size:15px;

    font-weight:800;

}


.products-count{

    color:var(--muted);

    font-size:10px;

}


/* ================================
   ÁREA DOS PRODUTOS
================================ */

.products-list{

    display:flex;

    flex-direction:column;

}


/* ================================
   PRODUTO REAL
================================ */

.product-item{

    min-height:78px;

    display:flex;

    align-items:center;

    gap:13px;

    border-bottom:1px solid var(--border);

}


.product-item:last-child{

    border-bottom:none;

}


.product-image{

    width:48px;
    height:48px;

    border-radius:8px;

    background:var(--input-bg);

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    flex-shrink:0;

}


.product-image img{

    width:100%;
    height:100%;

    object-fit:cover;

}


.product-placeholder{

    color:var(--muted);

}


.product-placeholder .material-icons-round{

    font-size:23px;

}


.product-details{

    flex:1;

    min-width:0;

}


.product-name{

    font-size:12px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.product-meta{

    margin-top:4px;

    color:var(--muted);

    font-size:9px;

}


/* ================================
   3 PONTINHOS
================================ */

.product-actions{

    position:relative;

}


.action-btn{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    border:0;

    color:var(--muted);

    cursor:pointer;

    border-radius:8px;

}


.action-btn:hover{

    background:var(--input-bg);

}


.action-btn .material-icons-round{

    font-size:22px;

}


/* ================================
   MENU DE AÇÕES
================================ */

.action-menu{

    position:absolute;

    top:43px;

    right:0;

    width:150px;

    background:var(--card-bg);

    border:1px solid var(--border);

    border-radius:9px;

    padding:6px;

    box-shadow:0 12px 30px rgba(0,0,0,.35);

    z-index:100;

    display:none;

}


.action-menu.open{

    display:block;

}


.action-item{

    width:100%;

    height:38px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:0 10px;

    background:transparent;

    border:0;

    border-radius:7px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:10px;

    font-weight:700;

    text-align:left;

    cursor:pointer;

}


.action-item:hover{

    background:var(--input-bg);

}


.action-item .material-icons-round{

    font-size:18px;

    color:var(--muted);

}


.action-item.danger{

    color:var(--red);

}


.action-item.danger .material-icons-round{

    color:var(--red);

}


/* ================================
   ESTADO VAZIO
================================ */

.empty-products{

    min-height:220px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}


.empty-products .material-icons-round{

    font-size:40px;

    color:var(--muted);

    margin-bottom:10px;

}


.empty-title{

    font-size:13px;

    font-weight:800;

}


.empty-text{

    margin-top:5px;

    max-width:300px;

    color:var(--muted);

    font-size:10px;

    line-height:1.5;

}


/* ================================
   DESKTOP
================================ */

@media(min-width:768px){

    body{

        padding-left:280px;

        padding-right:40px;

    }


    .side-menu{

        transform:translateX(0);

        visibility:visible;

    }


    .menu-btn{

        display:none;

    }


    .close-menu{

        display:none;

    }


    .menu-overlay{

        display:none;

    }

}


/* ================================
   MOBILE
================================ */

@media(max-width:767px){

    .container{

        max-width:600px;

    }


    .stats-grid{

        grid-template-columns:1fr;

    }

}


/* ================================
   CELULAR
================================ */

@media(max-width:520px){

    body{

        padding:80px 14px 25px;

    }


    .top-actions{

        right:14px;

    }


    .page-title{

        font-size:20px;

    }


    .stat-card{

        padding:20px;

    }


    .products-card{

        padding:18px;

    }


    .products-header{

        margin-bottom:15px;

    }

}

</style>

</head>


<body>


<!-- ================================
     OVERLAY
================================ -->

<div
class="menu-overlay"
id="menuOverlay"
onclick="closeMenu()">
</div>


<!-- ================================
     MENU
================================ -->

<aside
class="side-menu"
id="sideMenu">


<div class="side-menu-header">

<div class="side-menu-logo">

<img
src="./assets/logo.png"
alt="PRODUTIVA">

</div>


<button
class="close-menu"
onclick="closeMenu()">

<span class="material-icons-round">
close
</span>

</button>

</div>


<!-- PRINCIPAL -->

<div class="menu-section">

<div class="menu-section-title">
Principal
</div>


<button
class="menu-item"
onclick="menuAction('Dashboard')">

<span class="material-icons-round">
dashboard
</span>

<span>
Dashboard
</span>

</button>

</div>


<!-- GESTÃO -->

<div class="menu-section">

<div class="menu-section-title">
Gestão
</div>


<button
class="menu-item"
onclick="menuAction('Produtos')">

<span class="material-icons-round">
inventory_2
</span>

<span>
Produtos
</span>

</button>


<button
class="menu-item"
onclick="menuAction('Marketplace')">

<span class="material-icons-round">
storefront
</span>

<span>
Marketplace
</span>

</button>


<button
class="menu-item active"
onclick="menuAction('Afiliados')">

<span class="material-icons-round">
groups
</span>

<span>
Afiliados
</span>

</button>


<button
class="menu-item"
onclick="menuAction('Financeiro')">

<span class="material-icons-round">
account_balance_wallet
</span>

<span>
Financeiro
</span>

</button>

</div>


<!-- CONTA -->

<div class="menu-section">

<div class="menu-section-title">
Conta
</div>


<button
class="menu-item"
onclick="menuAction('Perfil')">

<span class="material-icons-round">
person_outline
</span>

<span>
Perfil
</span>

</button>

</div>

</aside>


<!-- ================================
     HAMBURGUER
================================ -->

<button
class="menu-btn"
onclick="openMenu()">

<span class="material-icons-round">
menu
</span>

</button>


<!-- ================================
     TOPO
================================ -->

<div class="top-actions">


<button
class="notification-btn"
onclick="openNotifications()">

<span class="material-icons-round">
notifications_none
</span>

</button>


<button
class="theme-btn"
onclick="toggleTheme()">

<span
class="material-symbols-outlined"
id="themeIcon">

wb_sunny

</span>

</button>

</div>


<!-- ================================
     CONTEÚDO
================================ -->

<main class="container">


<!-- CABEÇALHO -->

<div class="page-header">

<div class="page-title">
Afiliados
</div>

<div class="page-subtitle">
Gerencie os afiliados e os produtos afiliados.
</div>

</div>


<!-- ================================
     CARDS
================================ -->

<div class="stats-grid">


<!-- CARD AFILIADOS -->

<section class="stat-card">

<div class="stat-icon">

<span class="material-icons-round">
groups
</span>

</div>


<div class="stat-label">
Afiliados
</div>


<div
class="stat-value"
id="affiliateCount">

0

</div>

</section>


<!-- CARD PRODUTOS AFILIADOS -->

<section class="stat-card">

<div class="stat-icon">

<span class="material-icons-round">
inventory_2
</span>

</div>


<div class="stat-label">
Produtos Afiliados
</div>


<div
class="stat-value"
id="affiliateProductCount">

0

</div>

</section>


</div>


<!-- ================================
     PESQUISA
================================ -->

<section class="search-card">


<div class="search-box">

<span class="material-icons-round search-icon">
search
</span>


<input
type="search"
class="search-input"
id="productSearch"
placeholder="Pesquisar produtos afiliados..."
autocomplete="off">

</div>


</section>


<!-- ================================
     LISTA
================================ -->

<section class="products-card">


<div class="products-header">

<div class="products-title">
Produtos
</div>


<div
class="products-count"
id="productsCount">

0 produtos

</div>

</div>


<!--
     OS PRODUTOS REAIS SERÃO
     INSERIDOS AQUI PELO JAVASCRIPT
     / SUPABASE NO FUTURO.
-->

<div
class="products-list"
id="productsList">


<!-- ESTADO INICIAL -->

<div class="empty-products"
id="emptyProducts">

<span class="material-icons-round">
inventory_2
</span>


<div class="empty-title">
Nenhum produto
</div>


<div class="empty-text">
Os produtos que utilizam afiliação aparecerão aqui.
</div>

</div>


</div>


</section>


</main>


<!-- ================================
     TEMA
================================ -->

<script src="./js/theme.js"></script>


<script>

/* ================================
   MENU
================================ */

function openMenu(){

    document
    .getElementById("sideMenu")
    .classList.add("open");

    document
    .getElementById("menuOverlay")
    .classList.add("open");

    document.body.style.overflow="hidden";

}


function closeMenu(){

    document
    .getElementById("sideMenu")
    .classList.remove("open");

    document
    .getElementById("menuOverlay")
    .classList.remove("open");

    document.body.style.overflow="";

}


/* ================================
   NAVEGAÇÃO
================================ */

function menuAction(item){

    const routes={

        Dashboard:"./dashboard.html",

        Produtos:"./produtos.html",

        Marketplace:"./marketplace.html",

        Afiliados:"./afiliados.html",

        Financeiro:"./financeiro.html",

        Perfil:"./perfil.html"

    };


    if(routes[item]){

        window.location.href=routes[item];

    }

}


/* ================================
   NOTIFICAÇÕES
================================ */

function openNotifications(){

    alert("Notificações");

}


/* ================================
   MENU DE AÇÕES
================================ */

function toggleActionMenu(id){

    document
    .querySelectorAll(".action-menu")
    .forEach(menu => {

        if(menu.id !== id){

            menu.classList.remove("open");

        }

    });


    const menu=
    document.getElementById(id);


    if(menu){

        menu.classList.toggle("open");

    }

}


/* ================================
   AÇÕES DOS PRODUTOS
================================ */

function blockProduct(){

    alert("Bloquear produto");

}


function deactivateProduct(){

    alert("Desativar produto");

}


function activateProduct(){

    alert("Ativar produto");

}


/* ================================
   PESQUISA
================================ */

document
.getElementById("productSearch")
.addEventListener("input",function(){

    const search=
    this.value.toLowerCase().trim();


    const products=
    document.querySelectorAll(".product-item");


    products.forEach(product => {

        const name=
        product
        .querySelector(".product-name")
        .textContent
        .toLowerCase();


        if(name.includes(search)){

            product.style.display="flex";

        }else{

            product.style.display="none";

        }

    });

});


/* ================================
   FECHAR MENUS AO CLICAR FORA
================================ */

document.addEventListener("click",function(event){

    if(
        !event.target.closest(".product-actions")
    ){

        document
        .querySelectorAll(".action-menu")
        .forEach(menu => {

            menu.classList.remove("open");

        });

    }

});


/* ================================
   TEMA
================================ */

function updateThemeIcon(){

    const icon=
    document.getElementById("themeIcon");


    if(!icon)return;


    const light=
    document.body.classList.contains("light");


    icon.textContent=
    light
    ? "dark_mode"
    : "wb_sunny";

}


document.addEventListener(
"DOMContentLoaded",
updateThemeIcon
);


const observer=
new MutationObserver(
updateThemeIcon
);


observer.observe(
document.body,
{
    attributes:true,
    attributeFilter:["class"]
});

</script>


</body>

</html>
