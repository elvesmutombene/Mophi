<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dashboard | PRODUTIVA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
    rel="stylesheet"
>

<link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>

<!-- AUTENTICAÇÃO -->
<script src="./js/auth.js"></script>


<style>

/* =================================
   RESET
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =================================
   VARIÁVEIS
================================= */

:root{

    --body-bg:#000;

    --card-bg:#0A0A0A;

    --input-bg:#111;

    --border:#242424;

    --text:#fff;

    --muted:#777;

    --placeholder:#666;

    --green:#6EDC82;

    --yellow:#F5C542;
}


/* =================================
   MODO CLARO
================================= */

body.light{

    --body-bg:#F5F5F5;

    --card-bg:#FFFFFF;

    --input-bg:#F1F1F1;

    --border:transparent;

    --text:#111;

    --muted:#666;

    --placeholder:#888;
}


/* =================================
   BODY
================================= */

body{

    background:var(--body-bg);

    font-family:'Plus Jakarta Sans',sans-serif;

    color:var(--text);

    padding:80px 16px 20px;

    transition:
        background .25s ease,
        color .25s ease;
}


/* =================================
   MENU LATERAL
================================= */

.side-menu{

    position:fixed !important;

    top:0 !important;

    left:0 !important;

    width:240px !important;

    height:100vh !important;

    background:var(--card-bg) !important;

    border-right:1px solid var(--border);

    z-index:99999 !important;

    transform:translateX(-100%) !important;

    transition:transform .25s ease;

    padding:24px 16px;

    overflow-y:auto !important;

    overflow-x:hidden !important;

    display:block !important;

    visibility:hidden;

    opacity:1;

    isolation:isolate;
}


.side-menu.open{

    transform:translateX(0) !important;

    visibility:visible !important;

    opacity:1 !important;
}


.side-menu .side-menu-header{

    display:flex !important;

    visibility:visible !important;

    opacity:1 !important;
}


.side-menu .menu-section{

    display:block !important;

    visibility:visible !important;

    opacity:1 !important;

    position:relative !important;
}


.side-menu .menu-section-title{

    display:block !important;

    visibility:visible !important;

    opacity:1 !important;
}


.side-menu .menu-item{

    display:flex !important;

    visibility:visible !important;

    opacity:1 !important;
}


/* =================================
   OVERLAY
================================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:99998;

    opacity:0;

    visibility:hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


.menu-overlay.open{

    opacity:1;

    visibility:visible;
}


/* =================================
   CABEÇALHO DO MENU
================================= */

.side-menu-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;
}


.side-menu-logo{

    display:flex;

    align-items:center;
}


.side-menu-logo img{

    width:110px;

    height:auto;

    display:block;

    object-fit:contain;
}


.close-menu{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.close-menu .material-icons-round{

    font-size:24px;
}


/* =================================
   SEÇÕES DO MENU
================================= */

.menu-section{

    margin-bottom:27px;
}


.menu-section-title{

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin:0 10px 9px;
}


.menu-item{

    width:100%;

    height:46px;

    display:flex;

    align-items:center;

    gap:12px;

    background:transparent;

    border:0;

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:700;

    text-align:left;

    padding:0 10px;

    cursor:pointer;

    outline:0;

    -webkit-tap-highlight-color:transparent;
}


.menu-item .material-icons-round{

    color:var(--muted);

    font-size:21px;
}


.menu-item.active{

    background:var(--input-bg);
}


.menu-item.active .material-icons-round{

    color:var(--text);
}


.menu-item:hover,
.menu-item:active,
.menu-item:focus{

    background:var(--input-bg);

    color:var(--text);

    outline:0;
}


/* =================================
   BOTÃO HAMBÚRGUER
================================= */

.menu-btn{

    position:absolute;

    top:20px;

    left:16px;

    width:50px;

    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    border-radius:11px;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    filter:none !important;

    text-shadow:none !important;

    appearance:none;

    -webkit-appearance:none;

    -webkit-tap-highlight-color:transparent;
}


.menu-btn:hover,
.menu-btn:active,
.menu-btn:focus,
.menu-btn:focus-visible{

    background:transparent !important;

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}


.menu-btn .material-icons-round{

    color:var(--muted);

    font-size:28px;

    line-height:1;
}


/* =================================
   BOTÕES SUPERIORES
================================= */

.notification-btn,
.theme-btn{

    width:44px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    border-radius:11px;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    filter:none !important;

    text-shadow:none !important;

    appearance:none;

    -webkit-appearance:none;

    -webkit-tap-highlight-color:transparent;
}


.notification-btn:hover,
.notification-btn:active,
.notification-btn:focus,
.notification-btn:focus-visible,
.theme-btn:hover,
.theme-btn:active,
.theme-btn:focus,
.theme-btn:focus-visible{

    background:transparent !important;

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}


.notification-btn .material-icons-round{

    color:var(--muted);

    font-size:24px;
}


.theme-btn .material-symbols-outlined{

    color:var(--muted);

    font-size:24px;
}


.top-actions{

    position:absolute;

    top:20px;

    right:16px;

    display:flex;

    align-items:center;

    gap:9px;
}


/* =================================
   CARTÃO DO SALDO
================================= */

.balance-card{

    width:100%;

    max-width:600px;

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:28px 22px;

    position:relative;

    margin:auto;

    box-shadow:none !important;
}


.wallet-icon{

    position:absolute;

    top:22px;

    right:22px;

    width:32px;

    height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:var(--muted);
}


.wallet-icon .material-icons-round{

    font-size:29px;
}


.balance-label{

    color:var(--text);

    font-size:15px;

    font-weight:900;
}


.balance-value-row{

    display:flex;

    align-items:center;

    margin-top:12px;
}


.eye-btn{

    width:30px;

    height:30px;

    margin-right:12px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    color:var(--muted);

    border:0 !important;

    padding:0;

    cursor:pointer;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.eye-btn:hover,
.eye-btn:active,
.eye-btn:focus{

    background:transparent !important;

    color:var(--muted);

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}


.eye-btn .material-icons-round{

    font-size:21px;
}


.balance-value{

    width:150px;

    flex-shrink:0;

    font-size:21px;

    font-weight:900;

    color:var(--green);

    white-space:nowrap;
}


.withdraw-btn{

    margin-top:16px;

    display:flex;

    align-items:center;

    gap:3px;

    background:transparent !important;

    border:0 !important;

    padding:0;

    color:var(--yellow);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.withdraw-btn:hover,
.withdraw-btn:active,
.withdraw-btn:focus{

    background:transparent !important;

    color:var(--yellow);

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}


.withdraw-btn .material-icons-round{

    font-size:18px;
}


/* =================================
   PESQUISA
================================= */

.search-card{

    width:100%;

    max-width:600px;

    margin:16px auto 0;

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:18px 16px;

    box-shadow:none !important;
}


.search-box{

    width:100%;

    height:48px;

    display:flex;

    align-items:center;

    background:var(--input-bg);

    border:2px solid var(--border);

    border-radius:10px;

    padding:0 14px;

    gap:10px;
}


.search-box .material-icons-round{

    font-size:21px;

    color:var(--muted);
}


.search-box input{

    width:100%;

    background:transparent;

    border:0;

    outline:none;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:13px;
}


.search-box input::placeholder{

    color:var(--placeholder);
}


/* =================================
   VITRINE
================================= */

.vitrine-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:20px;
}


.vitrine-title{

    color:var(--text);

    font-size:17px;

    font-weight:800;
}


.category-btn{

    height:34px;

    display:flex;

    align-items:center;

    gap:4px;

    padding:0 10px;

    background:var(--input-bg);

    border:2px solid var(--border);

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}


.category-btn:hover,
.category-btn:active,
.category-btn:focus{

    background:var(--input-bg);

    color:var(--text);

    outline:0 !important;

    box-shadow:none !important;
}


.category-btn .material-icons-round{

    font-size:17px;
}


/* =================================
   LISTA DE PRODUTOS
================================= */

.products-list{

    display:flex;

    flex-direction:column;

    gap:14px;

    margin-top:18px;

    width:100%;
}


/* =================================
   LINHA DE PRODUTOS
================================= */

.product-row{

    display:flex;

    flex-wrap:nowrap;

    gap:10px;

    width:100%;

    overflow-x:auto;

    overflow-y:hidden;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

    touch-action:pan-x;
}


.product-row::-webkit-scrollbar{

    display:none;
}


/* =================================
   CARD DO PRODUTO
================================= */

.product-item{

    display:flex;

    flex-direction:column;

    flex:0 0 calc((100% - 20px) / 3);

    width:calc((100% - 20px) / 3);

    min-width:0;

    padding:6px;

    background:var(--input-bg);

    border:2px solid var(--border);

    border-radius:9px;

    box-shadow:none !important;
}


/* =================================
   FOTO
================================= */

.product-image{

    width:100%;

    height:105px;

    flex-shrink:0;

    border-radius:7px;

    overflow:hidden;

    background:#222;

    cursor:pointer;
}


.product-image img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;
}


/* =================================
   INFORMAÇÕES
================================= */

.product-info{

    width:100%;

    min-width:0;

    padding:7px 1px 3px;
}


.product-name{

    display:none;
}


/* =================================
   PROVÍNCIA + UNIDADES
================================= */

.product-location{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:3px;

    color:var(--muted);

    font-size:8px;

    font-weight:700;

    line-height:1.2;
}


.product-location > span:first-child{

    display:flex;

    align-items:center;

    min-width:0;

    max-width:100%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


.product-location .material-icons-round{

    font-size:12px;

    flex-shrink:0;

    margin-right:2px;
}


.product-stock{

    white-space:nowrap;
}


.product-stock.sold-out{

    color:#ff5555;

    font-weight:800;
}


/* Preço e botões não aparecem */

.product-price,
.product-actions{

    display:none;
}


/* =================================
   MODO CLARO
================================= */

body.light .search-box{

    border:2px solid #666;
}


body.light .category-btn{

    border:2px solid #666;
}


/* =================================
   RESPONSIVO — CELULAR
================================= */

@media(max-width:480px){

    body{

        padding:80px 14px 20px;
    }


    .menu-btn{

        left:14px;
    }


    .top-actions{

        right:14px;
    }


    .balance-card{

        padding:26px 20px;
    }


    .search-card{

        padding:16px 14px;
    }


    .product-row{

        gap:8px;

        overflow-x:auto;

        overflow-y:hidden;

        scrollbar-width:none;

        -webkit-overflow-scrolling:touch;

        touch-action:pan-x;
    }


    .product-row::-webkit-scrollbar{

        display:none;
    }


    .product-item{

        flex:0 0 calc((100% - 16px) / 3);

        width:calc((100% - 16px) / 3);

        min-width:0;

        padding:5px;
    }


    .product-image{

        height:85px;
    }


    .product-info{

        padding:6px 1px 2px;
    }


    .product-location{

        flex-direction:column;

        align-items:flex-start;

        gap:3px;

        font-size:7px;
    }


    .product-location .material-icons-round{

        font-size:11px;
    }

}


/* =================================
   DESKTOP / NOTEBOOK
   MENU PERMANENTEMENTE ABERTO
================================= */

@media(min-width:768px){

    /*
       Reserva espaço para o
       menu lateral de 240px
    */

    body{

        padding-left:280px;

        padding-right:40px;
    }


    /*
       MENU SEMPRE ABERTO
    */

    .side-menu{

        transform:translateX(0) !important;

        visibility:visible !important;

        opacity:1 !important;
    }


    /*
       Não existe overlay no PC
    */

    .menu-overlay{

        display:none !important;

        opacity:0 !important;

        visibility:hidden !important;
    }


    /*
       Esconde botão hamburger
    */

    .menu-btn{

        display:none !important;
    }


    /*
       Esconde botão X
       porque o menu é permanente
    */

    .close-menu{

        display:none !important;
    }


    /*
       Ações do topo
    */

    .top-actions{

        right:40px;
    }


    /*
       Conteúdo maior
    */

    .balance-card,
    .search-card{

        max-width:1100px;
    }


    .balance-card{

        padding:30px 26px;
    }


    .search-card{

        padding:20px;
    }


    .search-box{

        height:52px;
    }


    .vitrine-title{

        font-size:19px;
    }


    .category-btn{

        height:36px;
    }


    .products-list{

        gap:16px;
    }


    /*
       5 produtos por linha
    */

    .product-row{

        display:grid;

        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        gap:12px;

        overflow:visible;

        touch-action:auto;
    }


    .product-item{

        width:100%;

        min-width:0;

        flex:none;

        padding:7px;
    }


    .product-image{

        height:160px;
    }


    .product-info{

        padding:8px 1px 4px;
    }


    .product-location{

        font-size:9px;
    }


    .product-location .material-icons-round{

        font-size:13px;
    }

}


/* =================================
   DESKTOP GRANDE
================================= */

@media(min-width:1400px){

    .balance-card,
    .search-card{

        max-width:1200px;
    }


    .product-row{

        gap:14px;
    }


    .product-image{

        height:180px;
    }

}


/* =================================
   PROTEÇÃO CONTRA QUEBRA
================================= */

.product-item,
.product-image,
.product-info{

    min-width:0;
}

</style>

</head>


<body>


<!-- =================================
     OVERLAY
================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu()"
></div>


<!-- =================================
     MENU LATERAL
================================= -->

<aside
    class="side-menu"
    id="sideMenu"
>

    <div class="side-menu-header">

        <div class="side-menu-logo">

            <img
                src="./assets/logo.png"
                alt="PRODUTIVA"
            >

        </div>


        <button
            class="close-menu"
            onclick="closeMenu()"
            aria-label="Fechar menu"
        >

            <span class="material-icons-round">
                close
            </span>

        </button>

    </div>


    <!-- PRINCIPAL -->

    <div class="menu-section">

        <div class="menu-section-title">
            Principal
        </div>


        <button
            class="menu-item active"
            onclick="menuAction('Dashboard')"
        >

            <span class="material-icons-round">
                dashboard
            </span>

            <span>
                Dashboard
            </span>

        </button>

    </div>


    <!-- PRODUTOS -->

    <div class="menu-section">

        <div class="menu-section-title">
            Produtos
        </div>


        <button
            class="menu-item"
            onclick="menuAction('Cadastrar produtos')"
        >

            <span class="material-icons-round">
                add_box
            </span>

            <span>
                Cadastrar produtos
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Meus produtos')"
        >

            <span class="material-icons-round">
                inventory_2
            </span>

            <span>
                Meus produtos
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Pedidos')"
        >

            <span class="material-icons-round">
                shopping_bag
            </span>

            <span>
                Pedidos
            </span>

        </button>

    </div>


    <!-- FINANCEIRO -->

    <div class="menu-section">

        <div class="menu-section-title">
            Financeiro
        </div>


        <button
            class="menu-item"
            onclick="menuAction('Saques')"
        >

            <span class="material-icons-round">
                payments
            </span>

            <span>
                Saques
            </span>

        </button>


        <button
            class="menu-item"
            onclick="menuAction('Relatórios')"
        >

            <span class="material-icons-round">
                bar_chart
            </span>

            <span>
                Relatórios
            </span>

        </button>

    </div>


    <!-- CONTA -->

    <div class="menu-section">

        <div class="menu-section-title">
            Conta
        </div>


        <button
            class="menu-item"
            onclick="menuAction('Perfil')"
        >

            <span class="material-icons-round">
                person_outline
            </span>

            <span>
                Perfil
            </span>

        </button>

    </div>

</aside>


<!-- =================================
     BOTÃO MENU
================================= -->

<button
    class="menu-btn"
    onclick="openMenu()"
    aria-label="Abrir menu"
>

    <span class="material-icons-round">
        menu
    </span>

</button>


<!-- =================================
     AÇÕES DO TOPO
================================= -->

<div class="top-actions">


    <button
        class="notification-btn"
        onclick="openNotifications()"
        aria-label="Notificações"
    >

        <span class="material-icons-round">
            notifications_none
        </span>

    </button>


    <button
        class="theme-btn"
        onclick="toggleTheme()"
        aria-label="Alterar tema"
    >

        <span
            class="material-symbols-outlined"
            id="themeIcon"
        >
            wb_sunny
        </span>

    </button>

</div>


<!-- =================================
     SALDO
================================= -->

<div class="balance-card">


    <div class="wallet-icon">

        <span class="material-icons-round">
            account_balance_wallet
        </span>

    </div>


    <div class="balance-label">

        Saldo Disponível

    </div>


    <div class="balance-value-row">


        <button
            class="eye-btn"
            onclick="toggleBalance()"
            aria-label="Mostrar ou ocultar saldo"
        >

            <span
                class="material-icons-round"
                id="eye"
            >
                visibility
            </span>

        </button>


        <div
            class="balance-value"
            id="balance"
        >

            25.000 MT

        </div>

    </div>


    <button
        class="withdraw-btn"
        onclick="withdraw()"
    >

        <span>
            Sacar
        </span>

        <span class="material-icons-round">
            chevron_right
        </span>

    </button>

</div>


<!-- =================================
     PESQUISA / VITRINE
================================= -->

<div class="search-card">


    <div class="search-box">

        <span class="material-icons-round">
            search
        </span>


        <input
            type="text"
            id="searchInput"
            placeholder="Pesquisar produtos..."
        >

    </div>


    <div class="vitrine-header">


        <div class="vitrine-title">
            Vitrine
        </div>


        <button
            class="category-btn"
            onclick="openCategories()"
        >

            <span>
                Categorias
            </span>

            <span class="material-icons-round">
                expand_more
            </span>

        </button>

    </div>


    <div
        class="products-list"
        id="productsList"
    ></div>


</div>


<script>


/* =================================
   SALDO
================================= */

let balanceVisible = true;


function toggleBalance(){

    const balance =
        document.getElementById("balance");

    const eye =
        document.getElementById("eye");


    balanceVisible =
        !balanceVisible;


    if(balanceVisible){

        balance.textContent =
            "25.000 MT";

        eye.textContent =
            "visibility";

    }else{

        balance.textContent =
            "******";

        eye.textContent =
            "visibility_off";

    }

}


/* =================================
   SAQUE
================================= */

function withdraw(){

    alert("Área de saque");

}


/* =================================
   MENU
================================= */

function openMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("menuOverlay");


    sideMenu.style.visibility =
        "visible";

    sideMenu.style.opacity =
        "1";

    sideMenu.classList.add("open");

    overlay.classList.add("open");

}


function closeMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("menuOverlay");


    sideMenu.classList.remove("open");

    overlay.classList.remove("open");


    /*
       No PC o menu deve continuar aberto.
       Por isso não fechamos o menu quando
       a tela for desktop.
    */

    if(window.innerWidth >= 768){

        sideMenu.classList.add("open");

        sideMenu.style.visibility =
            "visible";

        sideMenu.style.opacity =
            "1";

        return;
    }


    setTimeout(function(){

        if(!sideMenu.classList.contains("open")){

            sideMenu.style.visibility =
                "hidden";

        }

    },260);

}


/* =================================
   AÇÕES DO MENU
================================= */

function menuAction(item){

    if(item === "Dashboard"){

        closeMenu();

        return;
    }


    if(item === "Cadastrar produtos"){

        window.location.href =
            "cadastrar-produto.html";

        return;
    }


    if(item === "Meus produtos"){

        window.location.href =
            "meus-produtos.html";

        return;
    }


    if(item === "Pedidos"){

        window.location.href =
            "pedidos.html";

        return;
    }


    if(item === "Saques"){

        window.location.href =
            "saques.html";

        return;
    }


    if(item === "Relatórios"){

        window.location.href =
            "relatorios.html";

        return;
    }


    if(item === "Perfil"){

        window.location.href =
            "perfil.html";

        return;
    }

}


/* =================================
   NOTIFICAÇÕES
================================= */

function openNotifications(){

    alert("Notificações");

}


/* =================================
   CATEGORIAS
================================= */

function openCategories(){

    alert("Categorias");

}


/* =================================
   DETALHES DO PRODUTO
================================= */

function productDetails(id){

    window.location.href =
        "detalhes-produto.html?id=" +
        encodeURIComponent(id);

}


/* =================================
   PESQUISA
================================= */

document
.getElementById("searchInput")
.addEventListener("input", function(){

    const search =
        this.value
        .toLowerCase()
        .trim();


    const products =
        document.querySelectorAll(
            ".product-item"
        );


    products.forEach(function(product){

        const nameElement =
            product.querySelector(
                ".product-name"
            );


        const name =
            nameElement
            ? nameElement.textContent.toLowerCase()
            : "";


        if(name.includes(search)){

            product.style.display =
                "flex";

        }else{

            product.style.display =
                "none";

        }

    });

});


/* =================================
   MODO CLARO / ESCURO
================================= */

function toggleTheme(){

    const body =
        document.body;

    const icon =
        document.getElementById(
            "themeIcon"
        );


    if(body.classList.contains("light")){

        body.classList.remove("light");

        icon.textContent =
            "wb_sunny";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }else{

        body.classList.add("light");

        icon.textContent =
            "dark_mode";

        localStorage.setItem(
            "theme",
            "light"
        );

    }

}


/* =================================
   CARREGAR TEMA
================================= */

function loadTheme(){

    const savedTheme =
        localStorage.getItem(
            "theme"
        );


    const icon =
        document.getElementById(
            "themeIcon"
        );


    if(savedTheme === "light"){

        document.body.classList.add(
            "light"
        );

        icon.textContent =
            "dark_mode";

    }else{

        document.body.classList.remove(
            "light"
        );

        icon.textContent =
            "wb_sunny";

    }

}


/* =================================
   CARREGAR PRODUTOS
================================= */

async function loadProducts(){

    const productsList =
        document.getElementById(
            "productsList"
        );


    productsList.innerHTML = `

        <div style="
            width:100%;
            text-align:center;
            color:var(--muted);
            font-size:12px;
            padding:25px 0;
        ">

            Carregando produtos...

        </div>

    `;


    const {

        data,

        error

    } =

        await supabaseClient

        .from("products")

        .select("*")

        .order("created_at", {

            ascending:false

        });


    if(error){

        console.error(

            "Erro ao carregar produtos:",

            error

        );


        productsList.innerHTML = `

            <div style="
                width:100%;
                text-align:center;
                color:var(--muted);
                font-size:12px;
                padding:25px 0;
            ">

                Não foi possível carregar os produtos.

            </div>

        `;

        return;

    }


    if(!data || data.length === 0){

        productsList.innerHTML = `

            <div style="
                width:100%;
                text-align:center;
                color:var(--muted);
                font-size:12px;
                padding:25px 0;
            ">

                Nenhum produto disponível.

            </div>

        `;

        return;

    }


    productsList.innerHTML = "";


    /*
       Divide os produtos em grupos de 5.

       Linha 1 = produtos 1 a 5
       Linha 2 = produtos 6 a 10
       Linha 3 = produtos 11 a 15
    */

    for(

        let i = 0;

        i < data.length;

        i += 5

    ){

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "product-row";


        const rowProducts =
            data.slice(
                i,
                i + 5
            );


        rowProducts.forEach(
            function(product){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "product-item";


                const image =
                    product.imagem ||
                    "./assets/product-placeholder.png";


                const name =
                    product.nome ||
                    "Produto";


                const province =
                    product.provincia ||
                    "Moçambique";


                const stock =
                    Number(
                        product.estoque || 0
                    );


                item.innerHTML = `

                    <div
                        class="product-image"
                        onclick="productDetails('${escapeJS(product.id)}')"
                    >

                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(name)}"
                        >

                    </div>


                    <div class="product-info">


                        <div class="product-name">

                            ${escapeHTML(name)}

                        </div>


                        <div class="product-location">


                            <span>

                                <span class="material-icons-round">
                                    location_on
                                </span>

                                ${escapeHTML(province)}

                            </span>


                            <span
                                class="product-stock ${
                                    stock <= 0
                                    ? "sold-out"
                                    : ""
                                }"
                            >

                                ${
                                    stock <= 0
                                    ? "ESGOTADO"
                                    : stock + " unidades"
                                }

                            </span>


                        </div>

                    </div>

                `;


                row.appendChild(
                    item
                );

            }
        );


        productsList.appendChild(
            row
        );

    }

}


/* =================================
   PROTEÇÃO CONTRA HTML
================================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value)

        .replace(/\\/g,"\\\\")

        .replace(/'/g,"\\'");

}


/* =================================
   GARANTIR MENU ABERTO NO PC
================================= */

function checkDesktopMenu(){

    const sideMenu =
        document.getElementById(
            "sideMenu"
        );

    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    if(window.innerWidth >= 768){

        sideMenu.classList.add("open");

        sideMenu.style.visibility =
            "visible";

        sideMenu.style.opacity =
            "1";

        overlay.classList.remove("open");

    }else{

        /*
           No celular o menu começa fechado.
        */

        if(!sideMenu.classList.contains("open")){

            sideMenu.style.visibility =
                "hidden";

        }

    }

}


/* =================================
   INICIAR
================================= */

loadTheme();

loadProducts();

checkDesktopMenu();


/* =================================
   QUANDO A JANELA MUDA DE TAMANHO
================================= */

window.addEventListener(
    "resize",
    checkDesktopMenu
);

</script>


</body>
</html>
