*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --body-bg:#000;
    --card-bg:#0A0A0A;
    --input-bg:#111;
    --border:#242424;
    --text:#fff;
    --muted:#777;
    --placeholder:#666;
    --green:#6EDC82;
    --yellow:#F5C542;
}

body.light{
    --body-bg:#F5F5F5;
    --card-bg:#FFFFFF;
    --input-bg:#F1F1F1;
    --border:transparent;
    --text:#111;
    --muted:#666;
    --placeholder:#888;
}

body{
    background:var(--body-bg);
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--text);
    padding:80px 16px 20px;
    transition:
        background .25s ease,
        color .25s ease;
}


/* =================================
   MENU LATERAL
================================= */

.side-menu{

    position:fixed !important;

    top:0 !important;
    left:0 !important;

    width:240px !important;
    height:100vh !important;

    background:var(--card-bg) !important;

    border-right:1px solid var(--border);

    z-index:99999 !important;

    transform:translateX(-100%) !important;

    transition:transform .25s ease;

    padding:24px 16px;

    overflow-y:auto !important;
    overflow-x:hidden !important;

    display:block !important;

    visibility:hidden;

    opacity:1;

    isolation:isolate;
}

.side-menu.open{

    transform:translateX(0) !important;

    visibility:visible !important;

    opacity:1 !important;
}


/* =================================
   CABEÇALHO DO MENU
================================= */

.side-menu-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;
}

.side-menu-logo{

    display:flex;

    align-items:center;
}

.side-menu-logo img{

    width:110px;

    height:auto;

    display:block;

    object-fit:contain;
}

.close-menu{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}

.close-menu .material-icons-round{

    font-size:24px;
}


/* =================================
   SEÇÕES DO MENU
================================= */

.menu-section{

    margin-bottom:27px;
}

.menu-section-title{

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin:0 10px 9px;
}

.menu-item{

    width:100%;

    height:46px;

    display:flex;

    align-items:center;

    gap:12px;

    background:transparent;

    border:0;

    border-radius:9px;

    color:var(--text);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:12px;

    font-weight:700;

    text-align:left;

    padding:0 10px;

    cursor:pointer;

    outline:0;

    -webkit-tap-highlight-color:transparent;
}

.menu-item .material-icons-round{

    color:var(--muted);

    font-size:21px;
}

.menu-item.active{

    background:var(--input-bg);
}

.menu-item.active .material-icons-round{

    color:var(--text);
}

.menu-item:hover,
.menu-item:active,
.menu-item:focus{

    background:var(--input-bg);

    color:var(--text);

    outline:0;
}


/* =================================
   OVERLAY
================================= */

.menu-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:99998;

    opacity:0;

    visibility:hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.menu-overlay.open{

    opacity:1;

    visibility:visible;
}


/* =================================
   BOTÃO HAMBÚRGUER
================================= */

.menu-btn{

    position:absolute;

    top:20px;

    left:16px;

    width:50px;

    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    border-radius:11px;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    filter:none !important;

    text-shadow:none !important;

    appearance:none;

    -webkit-appearance:none;

    -webkit-tap-highlight-color:transparent;
}

.menu-btn:hover,
.menu-btn:active,
.menu-btn:focus,
.menu-btn:focus-visible{

    background:transparent !important;

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}

.menu-btn .material-icons-round{

    color:var(--muted);

    font-size:28px;

    line-height:1;
}


/* =================================
   BOTÕES SUPERIORES
================================= */

.notification-btn,
.theme-btn{

    width:44px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    border:0 !important;

    border-radius:11px;

    color:var(--muted);

    cursor:pointer;

    padding:0;

    outline:0 !important;

    box-shadow:none !important;

    filter:none !important;

    text-shadow:none !important;

    appearance:none;

    -webkit-appearance:none;

    -webkit-tap-highlight-color:transparent;
}

.notification-btn:hover,
.notification-btn:active,
.notification-btn:focus,
.notification-btn:focus-visible,
.theme-btn:hover,
.theme-btn:active,
.theme-btn:focus,
.theme-btn:focus-visible{

    background:transparent !important;

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}

.notification-btn .material-icons-round{

    color:var(--muted);

    font-size:24px;
}

.theme-btn .material-symbols-outlined{

    color:var(--muted);

    font-size:24px;
}

.top-actions{

    position:absolute;

    top:20px;

    right:16px;

    display:flex;

    align-items:center;

    gap:9px;
}


/* =================================
   CONTAINER
================================= */

.dashboard-cards{

    width:100%;

    max-width:600px;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    gap:16px;
}


/* =================================
   CARD
================================= */

.dashboard-card{

    width:100%;

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:28px 22px;

    position:relative;

    box-shadow:none !important;
}

.card-icon{

    position:absolute;

    top:22px;

    right:22px;

    width:32px;

    height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:var(--muted);
}

.card-icon .material-icons-round{

    font-size:29px;
}

.card-label{

    color:var(--text);

    font-size:15px;

    font-weight:900;
}

.card-value{

    margin-top:12px;

    font-size:21px;

    font-weight:900;

    line-height:1.2;
}


/* =================================
   SALDO
================================= */

.balance-value-row{

    display:flex;

    align-items:center;

    margin-top:12px;
}

.eye-btn{

    width:30px;

    height:30px;

    margin-right:12px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent !important;

    color:var(--muted);

    border:0 !important;

    padding:0;

    cursor:pointer;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;

.eye-btn:hover,
.eye-btn:active,
.eye-btn:focus{

    background:transparent !important;

    color:var(--muted);

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}

.eye-btn .material-icons-round{

    font-size:21px;
}

.balance-value{

    width:150px;

    flex-shrink:0;

    font-size:21px;

    font-weight:900;

    color:var(--green);

    white-space:nowrap;
}


/* =================================
   SACAR
================================= */

.withdraw-btn{

    margin-top:16px;

    display:flex;

    align-items:center;

    gap:3px;

    background:transparent !important;

    border:0 !important;

    padding:0;

    color:var(--yellow);

    font-family:'Plus Jakarta Sans',sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    outline:0 !important;

    box-shadow:none !important;

    -webkit-tap-highlight-color:transparent;
}

.withdraw-btn:hover,
.withdraw-btn:active,
.withdraw-btn:focus{

    background:transparent !important;

    color:var(--yellow);

    border:0 !important;

    outline:0 !important;

    box-shadow:none !important;
}

.withdraw-btn .material-icons-round{

    font-size:18px;
}


/* =================================
   CORES
================================= */

.sales-value{

    color:var(--text);
}

.failed-value{

    color:#ff5555;
}

.conversion-value{

    color:var(--text);
}


/* =================================
   PAGAMENTOS
================================= */

.payment-card{

    width:100%;

    background:var(--card-bg);

    border:2px solid var(--border);

    border-radius:11px;

    padding:22px;

    position:relative;

    box-shadow:none !important;
}

.payment-header{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    margin-bottom:18px;
}

.payment-title{

    color:var(--text);

    font-size:15px;

    font-weight:900;
}

.payment-icon{

    color:var(--muted);

    font-size:29px;
}

.payment-method{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:13px;
}

.payment-method:last-child{

    margin-bottom:0;
}

.payment-logo{

    width:36px;

    height:36px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-radius:7px;
}

.payment-logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;
}

.payment-content{

    flex:1;

    min-width:0;
}

.payment-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:5px;
}

.payment-name{

    color:var(--text);

    font-size:12px;

    font-weight:800;
}

.payment-percent{

    color:var(--text);

    font-size:12px;

    font-weight:900;
}

.payment-progress{

    width:100%;

    height:6px;

    background:var(--input-bg);

    border-radius:20px;

    overflow:hidden;
}

.payment-progress-bar{

    height:100%;

    border-radius:20px;
}

.emola-progress{

    width:62%;

    background:var(--yellow);
}

.mpesa-progress{

    width:38%;

    background:var(--green);
}


/* =================================
   MODO CLARO
================================= */

body.light .dashboard-card,
body.light .payment-card{

    border:2px solid transparent;
}


/* =================================
   CELULAR
================================= */

@media(max-width:767px){

    body{

        padding:80px 14px 20px;
    }

    .menu-btn{

        left:14px;

        display:flex;
    }

    .top-actions{

        right:14px;
    }

    .dashboard-cards{

        display:flex;

        flex-direction:column;

        gap:14px;
    }

    .dashboard-card{

        padding:26px 20px;
    }

    .payment-card{

        padding:26px 20px;
    }

}


/* =================================
   PC / NOTEBOOK
   MENU PERMANENTE
================================= */

@media(min-width:768px){

    body{

        padding-top:80px;

        padding-left:280px;

        padding-right:40px;
    }


    /* MENU SEMPRE ABERTO */

    .side-menu{

        transform:translateX(0) !important;

        visibility:visible !important;

        opacity:1 !important;
    }


    /* NÃO MOSTRAR OVERLAY */

    .menu-overlay{

        display:none !important;

        visibility:hidden !important;

        opacity:0 !important;
    }


    /* NÃO MOSTRAR HAMBÚRGUER */

    .menu-btn{

        display:none !important;
    }


    /* NÃO MOSTRAR X */

    .close-menu{

        display:none !important;
    }


    /* CARDS */

    .dashboard-cards{

        max-width:1100px;

        display:grid;

        grid-template-columns:
            repeat(6, minmax(0,1fr));

        gap:16px;
    }


    .dashboard-cards > .dashboard-card:nth-child(1){

        grid-column:span 3;
    }

    .dashboard-cards > .dashboard-card:nth-child(2){

        grid-column:span 3;
    }

    .dashboard-cards > .dashboard-card:nth-child(3){

        grid-column:span 2;
    }

    .dashboard-cards > .dashboard-card:nth-child(4){

        grid-column:span 2;
    }

    .dashboard-cards > .payment-card{

        grid-column:span 2;
    }


    .dashboard-card{

        padding:28px 26px;
    }

}


/* =================================
   DESKTOP GRANDE
================================= */

@media(min-width:1400px){

    .dashboard-cards{

        max-width:1200px;
    }
}


/* =================================
   PROTEÇÃO
================================= */

.dashboard-card,
.payment-card{

    min-width:0;
}

/* =================================
   SALDO
================================= */

let balanceVisible = true;


function toggleBalance(){

    const balance =
        document.getElementById("balance");

    const eye =
        document.getElementById("eye");

    balanceVisible =
        !balanceVisible;


    if(balanceVisible){

        balance.textContent =
            "25.000 MT";

        eye.textContent =
            "visibility";

    }else{

        balance.textContent =
            "******";

        eye.textContent =
            "visibility_off";
    }

}

   SAQUE
================================= */

}


/* =================================
   MENU
================================= */

function openMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("menuOverlay");


    /* NO PC O MENU JÁ É PERMANENTE */

    if(window.innerWidth >= 768){

        sideMenu.classList.add("open");

        sideMenu.style.visibility =
            "visible";

        sideMenu.style.opacity =
            "1";

        overlay.classList.remove("open");

        return;
    }


    /* CELULAR */

    sideMenu.style.visibility =
        "visible";

    sideMenu.style.opacity =
        "1";

    sideMenu.classList.add("open");

    overlay.classList.add("open");
}


function closeMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("menuOverlay");


    /* NO PC NÃO FECHA */

    if(window.innerWidth >= 768){

        sideMenu.classList.add("open");

        sideMenu.style.visibility =
            "visible";

        sideMenu.style.opacity =
            "1";

        overlay.classList.remove("open");

        return;
    }


    /* CELULAR */

    sideMenu.classList.remove("open");

    overlay.classList.remove("open");


    setTimeout(function(){

        if(!sideMenu.classList.contains("open")){

            sideMenu.style.visibility =
                "hidden";
        }

    },260);
}

/* =================================
   TEMA
================================= */

function toggleTheme(){

    const body =
        document.body;

    const icon =
        document.getElementById("themeIcon");


    if(body.classList.contains("light")){

        body.classList.remove("light");

        icon.textContent =
            "wb_sunny";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }else{

        body.classList.add("light");

        icon.textContent =
            "dark_mode";

        localStorage.setItem(
            "theme",
            "light"
        );
    }

}


/* =================================
   CARREGAR TEMA
================================= */

function loadTheme(){

    const savedTheme =
        localStorage.getItem("theme");

    const icon =
        document.getElementById("themeIcon");


    if(savedTheme === "light"){

        document.body.classList.add("light");

        icon.textContent =
            "dark_mode";

    }else{

        document.body.classList.remove("light");

        icon.textContent =
            "wb_sunny";
    }

}


/* =================================
   GARANTIR MENU CORRETO
================================= */

function checkMenu(){

    const sideMenu =
        document.getElementById("sideMenu");

    const overlay =
        document.getElementById("menuOverlay");


    if(window.innerWidth >= 768){

        /* PC / NOTEBOOK */

        sideMenu.classList.add("open");

        sideMenu.style.transform =
            "translateX(0)";

        sideMenu.style.visibility =
            "visible";

        sideMenu.style.opacity =
            "1";

        overlay.classList.remove("open");

    }else{

        /* CELULAR */

        sideMenu.classList.remove("open");

        sideMenu.style.transform =
            "";

        sideMenu.style.visibility =
            "hidden";

        sideMenu.style.opacity =
            "1";

        overlay.classList.remove("open");
    }

}


/* =================================
   INICIAR
================================= */

loadTheme();

checkMenu();


/* =================================
   REDIMENSIONAMENTO
================================= */

window.addEventListener(
    "resize",
    checkMenu
);
